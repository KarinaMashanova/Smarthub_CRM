name: Smarthub Sync Cron

# GitHub Scheduled Actions могут опаздывать под нагрузкой, особенно на 0-й минуте часа.
# Поэтому lookback в sync/orders.ts и sync/sales.ts выставлен в 4 часа
# — каждый запуск перекрывает пропущенный промежуток. Минуты смещены от :00.
# workflow_dispatch позволяет запустить вручную если нужно.
on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger production sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret is empty"
            exit 1
          fi

          status=$(curl -sS -o response.txt -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://web-psi-vert-99.vercel.app/api/cron")

          echo "HTTP status: $status"
          cat response.txt

          if [ "$status" != "200" ]; then
            exit 1
          fi

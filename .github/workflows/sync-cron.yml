name: Smarthub Sync Cron

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger production sync
        env:
          CRON_URL: ${{ secrets.CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "$CRON_URL" ]; then
            echo "CRON_URL secret is empty"
            exit 1
          fi

          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret is empty"
            exit 1
          fi

          status=$(curl -sS -o response.txt -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$CRON_URL")

          echo "HTTP status: $status"
          cat response.txt

          if [ "$status" != "200" ]; then
            exit 1
          fi

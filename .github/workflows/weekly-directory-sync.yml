name: Smarthub Weekly Directory Sync

on:
  schedule:
    - cron: '7 3 * * 1'

jobs:
  sync-directories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger weekly shops and employees sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret is empty"
            exit 1
          fi

          status=$(curl -sS -o response.txt -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://web-psi-vert-99.vercel.app/api/cron/employees")

          echo "HTTP status: $status"
          cat response.txt

          if [ "$status" != "200" ]; then
            exit 1
          fi
